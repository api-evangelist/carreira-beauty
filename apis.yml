name: Carreira Beauty
description: >-
  Carreira Beauty (carreirabeauty.com) is a Brazilian online job marketplace connecting
  beauty, aesthetics, and wellness professionals with employment and freelance opportunities.
  The platform operates as a two-sided network that lets professionals — manicurists,
  hairdressers, estheticians, makeup artists, barbers, masotherapists, eyebrow designers,
  and salon receptionists — create a free professional profile and discover nearby openings,
  while salons, aesthetic clinics, spas, and studios post jobs and freelance ("freelas")
  shifts. It offers geographic filtering to match professionals with local roles, direct
  employer-to-professional communication over WhatsApp, and one free job posting per business
  with no credit card required. It is a portfolio company of 500 Global. Carreira Beauty is a
  consumer web application and does not currently publish a public developer API, SDKs, or
  API documentation.
